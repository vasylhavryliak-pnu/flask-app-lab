{% extends 'base.html' %}

{% block title %}Каталог товарів{% endblock %}

{% block content %}
<h1 class="mb-4">Каталог товарів</h1>

<div class="row">
    {% for item in products %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ item.name }}</h5>
                <h6 class="card-subtitle mb-3 text-primary fw-bold">${{ item.price }}</h6>
                <p class="card-text flex-grow-1">{{ item.content }}</p>
                <a href="{{ url_for('products.detail_product', product_id=item.id) }}" class="btn btn-outline-primary mt-2">Детальніше</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
