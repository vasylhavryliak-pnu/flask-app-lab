{% extends 'base.html' %}

{% block title %}{{ product.name }} — Деталі товару{% endblock %}

{% block content %}
<section class="resume-section">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">{{ product.name }}</h1>
        <span class="badge bg-success fs-5">${{ product.price }}</span>
    </div>
    <p class="text-muted">ID товару: #{{ product.id }}</p>
    <hr>
    <p class="lead">{{ product.content }}</p>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary mt-3">← Повернутися до списку товарів</a>
</section>
{% endblock %}
